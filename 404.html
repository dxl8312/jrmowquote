<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | JrMowQuote</title>
    <meta name="description" content="That page could not be found. Return to the free lawn mowing cost calculator and guides." />
    <!-- P8 review fix: a 404 page must not carry a canonical pointing at the homepage (would consolidate soft-404 signals). No canonical emitted. -->
    <style>
        :root{--green-900:#14361f;--ink:#1a241c;--muted:#5c6b60;--bg:#f6faf7;--card:#ffffff;--line:#e2e8e3;--lime:#8bd66f}
        *{box-sizing:border-box}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
        .wrap{max-width:720px;margin:0 auto;padding:48px 20px}
        h1{font-size:30px;color:var(--green-900);margin:0 0 12px}
        p{color:var(--muted);margin:0 0 16px}
        a.btn{display:inline-block;margin-top:12px;padding:11px 18px;border-radius:10px;background:var(--green-900);color:#fff;text-decoration:none;font-weight:700}
        ul{margin:12px 0 0;padding-left:20px;color:var(--muted)}
        ul a{color:var(--green-900)}
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Page not found</h1>
        <p>We could not find the page you were looking for. It may have moved, or the address may be misspelled.</p>
        <p><a class="btn" href="/">Back to the lawn mowing cost calculator</a></p>
        <p>Useful pages:</p>
        <ul>
            <li><a href="/methodology">How the calculator works</a></li>
            <li><a href="/pages/how-often-to-mow">How often to mow</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </main>
</body>
</html>
